server.port=8089

# 数据库配置（默认从环境变量读取，本地开发见 application-dev.properties）
spring.datasource.type=com.alibaba.druid.pool.DruidDataSource
spring.datasource.druid.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.druid.initial-size=5
spring.datasource.druid.min-idle=5
spring.datasource.druid.max-active=20
spring.datasource.druid.max-wait=60000
spring.datasource.druid.test-while-idle=true
spring.datasource.druid.time-between-eviction-runs-millis=60000
spring.datasource.druid.min-evictable-idle-time-millis=30000
spring.datasource.druid.validation-query=select 1
spring.datasource.druid.test-on-borrow=false
spring.datasource.druid.test-on-return=false
spring.datasource.druid.pool-prepared-statements=false
spring.datasource.druid.max-pool-prepared-statement-per-connection-size=-1
spring.datasource.druid.use-global-data-source-stat=true

# JPA（建表交给 Flyway，不自动生成）
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Flyway 数据库版本迁移：启动时自动执行 db/migration 下未应用的版本脚本
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# 非空库（已有历史表）首次接入时打 baseline，新库则直接从 V1 执行
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
# 禁用 clean（会清空库），生产安全保护
spring.flyway.clean-disabled=true
# 厂商密钥通过环境变量注入 V1 占位符；未注入时对应模型 enabled=0
# 变量名：TENCENT_TOKENHUB_KEY / DEEPSEEK_KEY / ALIYUN_BAILIAN_KEY_1 / ALIYUN_BAILIAN_KEY_2
spring.flyway.placeholders.tencent_tokenhub_key=${TENCENT_TOKENHUB_KEY:}
spring.flyway.placeholders.deepseek_key=${DEEPSEEK_KEY:}
spring.flyway.placeholders.aliyun_key_1=${ALIYUN_BAILIAN_KEY_1:}
spring.flyway.placeholders.aliyun_key_2=${ALIYUN_BAILIAN_KEY_2:}

# JWT 配置
jwt.secret=${JWT_SECRET:}
jwt.expiration=604800

# 开发模式 bypass token（生产环境请留空或删除）
dev.bypass-token=${DEV_BYPASS_TOKEN:}

# 内部配置读取令牌（GET /api/internal/node-config，Node 服务专用）
# 留空则接口关闭并返回 503；必须与用户/管理员登录 token 完全独立，仅经受控内网或 HTTPS 交付
node.config.read.token=${NODE_CONFIG_READ_TOKEN:}

# 签名媒体本地存储根目录（生产可换成对象存储实现）
media.generated-dir=${MEDIA_GENERATED_DIR:./media/generated}
media.reference-dir=${MEDIA_REFERENCE_DIR:./media/reference}
media.digital-human-dir=${MEDIA_DIGITAL_HUMAN_DIR:./media/digital-human}
