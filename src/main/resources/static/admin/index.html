<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>概览 | AIGC Studio 管理后台</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/admin.css">
</head>
<body class="admin-body">
  <div class="app-shell">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none">
            <path d="M5 7.5h22M5 16h22M5 24.5h22" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
            <path d="M10.5 7.5v17M21.5 7.5v17" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" opacity=".5"/>
          </svg>
        </span>
        <div>
          <strong>AIGC Studio</strong>
          <span>Admin Console</span>
        </div>
      </div>

      <nav class="sidebar-nav" aria-label="管理菜单">
        <p class="sidebar-nav-label">系统管理</p>
        <a class="nav-item is-active" href="./index.html" aria-current="page">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="3" stroke="currentColor" stroke-width="1.8"/><path d="M9 10h6M9 14h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </span>
          <span>概览</span>
        </a>
        <a class="nav-item" href="./organizations.html" data-any-permission="org:view">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><path d="M4 20V8l8-5 8 5v12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 20v-6h6v6M8 10h.01M12 10h.01M16 10h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </span>
          <span>组织管理</span>
        </a>
        <a class="nav-item" href="./permissions.html" data-any-permission="role:view">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><path d="M14.5 9.5a4.5 4.5 0 11-3.2 7.7L4 21.5 2.5 20 4 18.5 2.5 17 5 14.5l1.5 1.5 3-3a4.5 4.5 0 015-3.5z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><circle cx="16" cy="8" r="1.2" fill="currentColor"/></svg>
          </span>
          <span>权限管理</span>
        </a>
        <a class="nav-item" href="./roles.html" data-any-permission="role:view">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 3l2.4 4.9 5.4.8-3.9 3.8.9 5.4-4.8-2.5-4.8 2.5.9-5.4-3.9-3.8 5.4-.8L12 3z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
          </span>
          <span>角色管理</span>
        </a>
        <a class="nav-item" href="./users.html" data-any-permission="user:view">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.8"/><path d="M5 20c.7-3.4 3.2-5.5 7-5.5s6.3 2.1 7 5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </span>
          <span>用户管理</span>
        </a>
      </nav>

      <div class="sidebar-note">
        <span class="note-dot" aria-hidden="true"></span>
        <strong>进入对应模块办理</strong>
        <p>左侧菜单按权限显示，找不到入口说明缺少对应权限。</p>
      </div>

      <div class="sidebar-user">
        <span id="userAvatar" class="avatar">A</span>
        <span class="sidebar-user-meta">
          <strong id="sidebarUserName">-</strong>
          <small id="sidebarUserOrg">-</small>
        </span>
        <button class="icon-btn sidebar-logout" type="button" aria-label="退出登录" title="退出登录" data-logout>
          <svg viewBox="0 0 24 24" fill="none"><path d="M9 5H5.5A1.5 1.5 0 004 6.5v11A1.5 1.5 0 005.5 19H9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M14 8l4 4-4 4M18 12H9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </aside>
    <button id="sidebarScrim" class="sidebar-scrim" type="button" aria-label="关闭菜单" hidden></button>

    <div class="main-wrap">
      <header class="topbar">
        <button id="menuBtn" class="icon-btn menu-btn" type="button" aria-label="打开菜单">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <div class="topbar-title">
          <p class="eyebrow">OVERVIEW</p>
          <h1>概览</h1>
        </div>
        <div class="topbar-actions">
          <span class="user-chip">
            <span class="avatar avatar-sm" id="topbarAvatar">A</span>
            <span class="user-chip-text">
              <strong id="topbarUserName">-</strong>
              <small id="topbarUserOrg">-</small>
            </span>
          </span>
          <button class="btn btn-ghost btn-sm" type="button" data-logout>退出登录</button>
        </div>
      </header>

      <main class="content">
        <section class="panel">
          <div class="panel-head">
            <div>
              <h2 id="greetingTitle">欢迎回来</h2>
              <p id="greetingSummary" class="muted">加载中...</p>
            </div>
          </div>

          <div class="form-grid">
            <div class="field">
              <span class="field-label">用户名</span>
              <input id="profileUsername" type="text" readonly value="-">
            </div>
            <div class="field">
              <span class="field-label">姓名</span>
              <input id="profileRealName" type="text" readonly value="-">
            </div>
            <div class="field">
              <span class="field-label">所属组织</span>
              <input id="profileOrg" type="text" readonly value="-">
            </div>
            <div class="field">
              <span class="field-label">角色</span>
              <input id="profileRoles" type="text" readonly value="-">
            </div>
          </div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <div>
              <h2>快捷入口</h2>
              <p class="muted">按当前账号的权限显示</p>
            </div>
          </div>
          <div class="form-grid">
            <a class="field" href="./organizations.html" data-any-permission="org:view">
              <span class="field-label">组织管理</span>
              创建组织、维护组织信息与初始管理员
            </a>
            <a class="field" href="./users.html" data-any-permission="user:view">
              <span class="field-label">用户管理</span>
              新建用户、分配角色、重置密码
            </a>
            <a class="field" href="./roles.html" data-any-permission="role:view">
              <span class="field-label">角色管理</span>
              管理本组织角色并分配权限
            </a>
            <a class="field" href="./permissions.html" data-any-permission="role:view">
              <span class="field-label">权限管理</span>
              查看全局权限与启用状态
            </a>
          </div>
        </section>
      </main>
    </div>
  </div>

  <div id="toastRoot" class="toast-root" aria-live="polite"></div>

  <script src="./assets/common.js"></script>
  <script src="./assets/page.js"></script>
  <script>
    (function () {
      'use strict';
      AdminPage.init().then(function (user) {
        if (!user) {
          return;
        }
        var roles = Array.isArray(user.roles) ? user.roles.join(', ') : '';
        document.getElementById('profileUsername').value = user.username || '-';
        document.getElementById('profileRealName').value = user.realName || '-';
        document.getElementById('profileOrg').value = user.orgName || '-';
        document.getElementById('profileRoles').value = roles || '-';
        document.getElementById('greetingTitle').textContent =
          '欢迎回来' + ((user.realName || user.username) ? '，' + (user.realName || user.username) : '');
        document.getElementById('greetingSummary').textContent =
          user.firstLogin ? '检测到首次登录，建议尽快修改初始密码。' : '登录状态正常。';
      });
    })();
  </script>
</body>
</html>
